---
- name: Copy all static files
  ansible.builtin.copy:
    src: "{{ repo_services_dir }}/"
    dest: "{{ remote_dir }}"
    mode: "0644"

- name: Find all service files
  delegate_to: localhost
  become: false
  ansible.builtin.find:
    paths: "{{ repo_services_dir }}"
    recurse: true
    patterns:
      - "*.sops"
      - "*.j2"
  register: service_files

- name: Decrypt and copy sops files
  ansible.builtin.copy:
    content: "{{ lookup('community.sops.sops', item.path) }}"
    dest: "{{ remote_dir }}/{{ item.path | replace(repo_services_dir + '/', '') | regex_replace('\\.sops$', '') }}"
    mode: "0600"
  loop: "{{ service_files.files }}"
  when: item.path.endswith('.sops')
  no_log: true

- name: Render and copy j2 templates
  ansible.builtin.copy:
    content: "{{ lookup('template', item.path) }}"
    dest: "{{ remote_dir }}/{{ item.path | replace(repo_services_dir + '/', '') | regex_replace('\\.j2$', '') }}"
    mode: "0644"
  loop: "{{ service_files.files }}"
  when: item.path.endswith('.j2')
  no_log: true

- name: Remove sops and j2 files from remote
  ansible.builtin.file:
    path: "{{ remote_dir }}/{{ item.path | replace(repo_services_dir + '/', '') }}"
    state: absent
  loop: "{{ service_files.files }}"
  no_log: true
