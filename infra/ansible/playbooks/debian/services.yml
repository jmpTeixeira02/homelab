---
- name: Deploy Services
  hosts: debian
  become: true
  vars:
    services_dir: "{{ (playbook_dir + '/../../../../services') | realpath }}"
    remote_services_dir: .
    shared_env_content: "{{ lookup('community.sops.sops', services_dir + '/env.sops') }}"
    domain: "{{ shared_env_content | regex_search('DOMAIN=(.*)', '\\1') | first }}"
    email: "{{ shared_env_content | regex_search('EMAIL=(.*)', '\\1') | first }}"

  handlers:
    - name: Restart systemd-resolved
      systemd:
        name: systemd-resolved
        state: restarted

  tasks:
    - name: Copy all static files
      copy:
        src: "{{ services_dir }}/"
        dest: "{{ remote_services_dir }}/services"
        mode: "0644"

    - name: Find all service files
      delegate_to: localhost
      become: false
      find:
        paths: "{{ services_dir }}"
        recurse: yes
        patterns:
          - "*.sops"
          - "*.j2"
      register: service_files

    - name: Decrypt and copy sops files
      copy:
        content: "{{ lookup('community.sops.sops', item.path) }}"
        dest: "{{ remote_services_dir }}/services/{{ item.path | replace(services_dir + '/', '') | regex_replace('\\.sops$', '') }}"
        mode: "0600"
      loop: "{{ service_files.files }}"
      when: item.path.endswith('.sops')
      no_log: true

    - name: Render and copy j2 templates
      copy:
        content: "{{ lookup('template', item.path) }}"
        dest: "{{ remote_services_dir }}/services/{{ item.path | replace(services_dir + '/', '') | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop: "{{ service_files.files }}"
      when: item.path.endswith('.j2')

    - name: Remove sops and j2 files from remote
      file:
        path: "{{ remote_services_dir }}/services/{{ item.path | replace(services_dir + '/', '') }}"
        state: absent
      loop: "{{ service_files.files }}"

    - name: Configure systemd-resolved for AdGuardHome
      block:
        - name: Create systemd-resolved config directory
          file:
            path: /etc/systemd/resolved.conf.d
            state: directory
            mode: "0755"

        - name: Disable DNSStubListener
          copy:
            dest: /etc/systemd/resolved.conf.d/adguardhome.conf
            content: |
              [Resolve]
              DNS=127.0.0.1
              DNSStubListener=no
            mode: "0644"

        - name: Link resolv.conf and restart
          file:
            src: /run/systemd/resolve/resolv.conf
            dest: /etc/resolv.conf
            state: link
            force: true
          notify: Restart systemd-resolved

    - name: Force DNS restart before Docker deployment
      meta: flush_handlers

    - name: Deploy all services
      community.docker.docker_compose_v2:
        project_src: "{{ remote_services_dir }}/services"
        project_name: homelab
        state: present
        remove_orphans: true
        env_files:
          - env
