---
- name: Copy all static files
  copy:
    src: "{{ services_dir }}/"
    dest: "{{ remote_services_dir }}/services"
    mode: "0644"

- name: Find all service files
  delegate_to: localhost
  become: false
  find:
    paths: "{{ services_dir }}"
    recurse: yes
    patterns:
      - "*.sops"
      - "*.j2"
  register: service_files

- name: Decrypt and copy sops files
  copy:
    content: "{{ lookup('community.sops.sops', item.path) }}"
    dest: "{{ remote_services_dir }}/services/{{ item.path | replace(services_dir + '/', '') | regex_replace('\\.sops$', '') }}"
    mode: "0600"
  loop: "{{ service_files.files }}"
  when: item.path.endswith('.sops')
  no_log: true

- name: Render and copy j2 templates
  copy:
    content: "{{ lookup('template', item.path) }}"
    dest: "{{ remote_services_dir }}/services/{{ item.path | replace(services_dir + '/', '') | regex_replace('\\.j2$', '') }}"
    mode: "0644"
  loop: "{{ service_files.files }}"
  when: item.path.endswith('.j2')
  no_log: true

- name: Remove sops and j2 files from remote
  file:
    path: "{{ remote_services_dir }}/services/{{ item.path | replace(services_dir + '/', '') }}"
    state: absent
  loop: "{{ service_files.files }}"
  no_log: true
