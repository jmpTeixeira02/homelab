---
- name: Configure systemd-resolved for AdGuardHome
  block:
    - name: Create systemd-resolved config directory
      file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"

    - name: Disable DNSStubListener
      copy:
        dest: /etc/systemd/resolved.conf.d/adguardhome.conf
        content: |
          [Resolve]
          DNS=127.0.0.1
          DNSStubListener=no
        mode: "0644"

    - name: Link resolv.conf and restart
      file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
      notify: Restart systemd-resolved

- name: Force DNS restart before Docker deployment
  meta: flush_handlers
