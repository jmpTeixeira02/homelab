name: homelab
services:
  adguard:
    image: adguard/adguardhome
    container_name: adguard
    ports:
      - "3000:3000/tcp"
      - "53:53/tcp"
      - "53:53/udp"
      - "853:853/tcp"
      - "5443:5443/tcp"
      - "5443:5443/udp"
    networks:
      - proxy
    restart: unless-stopped
    volumes:
      - ./data/adguard:/opt/adguardhome/work
      - ./config/adguard:/opt/adguardhome/conf
    labels:
      - traefik.enable=true
      - traefik.http.routers.adguard.tls=true
      - traefik.http.routers.adguard.entryPoints=websecure
      - traefik.http.routers.adguard.rule=Host(`adguard.${DOMAIN}`)
      - traefik.http.routers.adguard.tls.certresolver=desec
      - traefik.http.routers.adguard.tls.domains[0].main=${DOMAIN}
      - traefik.http.routers.adguard.tls.domains[0].sans=*.${DOMAIN}
      - traefik.http.services.adguard.loadbalancer.server.port=80
  ddns-updater:
    image: qmcgaw/ddns-updater:v2.8
    container_name: ddns-updater
    environment:
      CONFIG: |
        {
          "settings": [
            {
              "provider": "desec",
              "domain": "${DOMAIN}",
              "token": "${DESEC_TOKEN}",
              "ip_version": "ipv4"
            }
          ]
        }
    labels:
      - traefik.enable=true
      - traefik.http.routers.ddns-updater.tls=true
      - traefik.http.routers.ddns-updater.entryPoints=websecure
      - traefik.http.routers.ddns-updater.rule=Host(`ddns-updater.${DOMAIN}`)
      - traefik.http.routers.ddns-updater.tls.certresolver=desec
      - traefik.http.routers.ddns-updater.tls.domains[0].main=${DOMAIN}
      - traefik.http.routers.ddns-updater.tls.domains[0].sans=*.${DOMAIN}
    networks:
      - proxy
    restart: unless-stopped
  traefik:
    image: traefik:v3.6
    container_name: traefik
    ports:
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./data/certs/:/var/traefik/certs/:rw
    environment:
      - DESEC_TOKEN=${DESEC_TOKEN}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.entryPoints=websecure
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.tls.certresolver=desec
      - traefik.http.routers.traefik.tls.domains[0].main=${DOMAIN}
      - traefik.http.routers.traefik.tls.domains[0].sans=*.${DOMAIN}
    restart: unless-stopped
networks:
  proxy:
    name: proxy
    driver: bridge
